seed: 42

dataset:
  primary:
    - natural_questions
    - fever
  optional:
    - finder

# Frozen after the NQ retrieval pilot. See docs/RETRIEVAL_CONFIG.md.
# E5 index/results are kept for comparison and must not be overwritten.
retrieval:
  embedding_model: BAAI/bge-base-en-v1.5
  top_k: 5
  index_type: faiss_flat_ip
  normalize_embeddings: true
  chunk_size: 512
  chunk_overlap: 64

generator:
  model_name: null
  max_new_tokens: 256
  temperature: 0.2

paths:
  data_raw: data/raw
  data_processed: data/processed
  models: models
  checkpoints: checkpoints
  results: results
